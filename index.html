<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>在成为勇者之前</title>
<!-- 字体：霞鹜文楷（LXGW WenKai）—— 免费可商用，jsDelivr CDN，font-display:swap 保证不阻塞文字渲染 -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <div id="hud"></div>
  <div id="iconbar"></div>
  <div id="main">
    <div id="leftLog">
      <div class="panel-title">行动记录</div>
      <div id="logBody"></div>
    </div>
    <div id="mapWrap">
      <div id="mapViewport"><div id="mapGrid"></div></div>
    </div>
    <div id="rightPanel">
      <div class="panel-title" id="rightTitle">信息</div>
      <div id="promptZone"></div>
      <button id="goBtn">前往</button>
    </div>
  </div>
  <div id="bottom" class="mode-story">
    <div id="storyBox">
      <div id="storyHead">
        <div id="storySpeaker"></div>
        <div id="storyControls">
          <button id="autoBtn" class="sctrl" title="自动模式">自动</button>
          <button id="skipBtn" class="sctrl" title="跳过本段剧情">跳过</button>
        </div>
      </div>
      <div id="storyBody"></div>
    </div>
    <div id="combatZone">
      <div id="row1">
        <div id="row1Chars"></div>
        <div id="row1Attrs"></div>
      </div>
      <div id="row2">
        <div id="skillGroup"></div>
        <button id="fleeBtn" class="squareBtn" onclick="tryFlee()">逃跑</button>
      </div>
      <div id="row3">
        <div id="statusChips"></div>
        <div id="talentTags"></div>
      </div>
      <div id="row4">
        <div id="skillDesc"></div>
      </div>
    </div>
  </div>
</div>
<div id="menuOverlay" class="overlay show">
  <div class="modal small">
    <h2>在成为勇者之前</h2>
    <div id="menuBtns"></div>
  </div>
</div>
<div id="modalOverlay" class="overlay">
  <div class="modal" id="modal">
    <button class="modal-x" id="modalX" onclick="onModalX()" aria-label="关闭">✕</button>
    <h2 id="modalTitle"></h2>
    <div id="modalBody"></div>
  </div>
</div>
<div id="gameoverOverlay" class="overlay">
  <div class="modal small">
    <h2>健康值归零 · 流浪终结</h2>
    <p id="goMsg"></p>
    <button class="mbtn" onclick="loadAfterGameOver()">读取存档</button>
    <button class="mbtn" onclick="backToMenu()">返回主界面</button>
  </div>
</div>
<div id="tooltip"></div>
<div id="popover"></div>
<div id="actTitleOverlay" class="act-title-overlay"></div>

<script src="js/data.js"></script>
<script src="js/save.js"></script>
<script src="js/map.js"></script>
<script src="js/rules.js"></script>
<script src="js/reactions.js"></script>
<script src="js/explore.js"></script>
<script src="js/combat.js"></script>
<script src="js/ui.js"></script>
<script src="js/craft.js"></script>
<script src="js/vehicle.js"></script>
<script src="js/event.js"></script>
<script src="main_story/index.js" type="module"></script>
<script src="js/main.js"></script>
</body>
</html>
