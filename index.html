<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>异世界流浪日记 · 核心循环</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <div id="hud"></div>
  <div id="iconbar"></div>
  <div id="main">
    <div id="leftLog">
      <div class="panel-title">行动记录</div>
      <div id="logBody"></div>
    </div>
    <div id="mapWrap">
      <div id="mapViewport"><div id="mapGrid"></div></div>
    </div>
    <div id="rightPanel">
      <div class="panel-title" id="rightTitle">信息</div>
      <div id="promptZone"></div>
      <button id="goBtn">前往</button>
    </div>
  </div>
  <div id="bottom" class="mode-story">
    <div id="storyBox">
      <div id="storyBody"></div>
    </div>
    <div id="combatZone">
      <div id="combatMain">
        <div id="combatLeft">
          <div id="allyBar"></div>
          <div id="charAttrs"></div>
          <div id="statusBar"></div>
          <div id="skillList"></div>
          <div id="talentBox"></div>
        </div>
        <div id="combatRight">
          <div id="skillDetail"></div>
        </div>
      </div>
    </div>
  </div>
</div>
<div id="menuOverlay" class="overlay show">
  <div class="modal small">
    <h2>异世界流浪日记</h2>
    <div id="menuBtns"></div>
  </div>
</div>
<div id="modalOverlay" class="overlay">
  <div class="modal">
    <h2 id="modalTitle"></h2>
    <div id="modalBody"></div>
    <div class="btn-row" style="margin-top:8px">
      <button class="mbtn small" onclick="closeModal()">关闭</button>
    </div>
  </div>
</div>
<div id="gameoverOverlay" class="overlay">
  <div class="modal small">
    <h2>健康值归零 · 流浪终结</h2>
    <p id="goMsg"></p>
    <button class="mbtn" onclick="loadAfterGameOver()">读取存档</button>
    <button class="mbtn" onclick="backToMenu()">返回主界面</button>
  </div>
</div>
<div id="tooltip"></div>
<div id="popover"></div>

<!-- 模块化脚本：按依赖顺序加载（经典全局，函数/变量跨文件共享） -->
<script src="js/data.js"></script>
<script src="js/save.js"></script>
<script src="js/map.js"></script>
<script src="js/explore.js"></script>
<script src="js/combat.js"></script>
<script src="js/ui.js"></script>
<script src="js/main.js"></script>
</body>
</html>
