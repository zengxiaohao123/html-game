<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>在成为勇者之前</title>
<!-- 字体：霞鹜文楷（LXGW WenKai）—— 免费可商用，jsDelivr CDN，font-display:swap 保证不阻塞文字渲染 -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">

<script>
// ===== storyStartFragment 紧急 polyfill（main_story/index.js 引用）=====
(function() {
  if (typeof window.storyStartFragment !== 'function') {
    window.storyStartFragment = function(segments, done, opts) {
      setTimeout(() => { if (typeof done === 'function') done(); }, 200);
    };
  }
  if (typeof window.finishCurrentFragment !== 'function') {
    window.finishCurrentFragment = function() {};
  }
  if (typeof window.renderIconbar !== 'function') {
    window.renderIconbar = function() {};
  }
})();
</script>

<script>
// ===== main_story 紧急 polyfill（必须在 main_story/index.js 加载前可用）=====
(function() {
  const list = [
    'storyStartFragment','storySetSpeaker','storyMarkChoice',
    'storyPush','storyRunNext','storyAutoMode',
    'finishCurrentFragment','finishMainStorySeg',
    'renderIconbar','refreshHUD','showActTitle',
  ];
  for (const n of list) {
    if (typeof window[n] !== 'function') {
      window[n] = (...args) => {
        if (n === 'storyStartFragment' && args.length >= 2 && typeof args[1] === 'function') {
          setTimeout(() => args[1](), 250);
        }
      };
    }
  }
  if (typeof window.mainStoryPlaying === 'undefined') window.mainStoryPlaying = false;
})();
</script>

<script>
// 兜底：补齐 main_story 任何可能遗漏的引用
(function() {
  const list = [
    'forceEndStoryFlow', 'storyPush', 'storyRunNext',
    'storyMarkChoice', 'storyAutoMode', 'finishCurrentFragment',
    'finishMainStorySeg', 'renderIconbar', 'refreshHUD',
    'showActTitle', 'unlockEventUI', 'storySetSpeaker',
    'storyStartFragment',
  ];
  for (const n of list) {
    if (typeof window[n] !== 'function') {
      window[n] = function(...args) {
        if (n === 'storyStartFragment' && args.length >= 2 && typeof args[1] === 'function') {
          setTimeout(() => args[1](), 50);
        }
      };
    }
  }
  if (typeof window.mainStoryPlaying === 'undefined') window.mainStoryPlaying = false;
  if (typeof window.storyAutoMode === 'undefined') window.storyAutoMode = false;
})();
</script>


<script>
// ===== main_story 紧急 polyfill（HEAD 里，module 加载前执行）=====
(function() {
  // 基础存在性
  const list = [
    'storyStartFragment','storySetSpeaker','storyMarkChoice',
    'storyPush','storyRunNext','storyAutoMode','finishCurrentFragment',
    'finishMainStorySeg','forceEndStoryFlow','renderIconbar',
    'refreshHUD','showActTitle','unlockEventUI',
  ];
  for (const n of list) {
    if (typeof window[n] !== 'function') {
      window[n] = function(...args) {
        if (n === 'storyStartFragment' && args.length >= 2 && typeof args[1] === 'function') {
          setTimeout(() => args[1](), 30);
        }
      };
    }
  }
  if (typeof window.mainStoryPlaying === 'undefined') window.mainStoryPlaying = false;
  if (typeof window.storyAutoMode === 'undefined') window.storyAutoMode = false;
  if (typeof window.eventState === 'undefined') window.eventState = null;
  if (typeof window.prompt !== 'function') window.prompt = () => {};
  if (typeof window.renderMainStoryOptions !== 'function') window.renderMainStoryOptions = () => {};
  if (typeof window.isInFlow !== 'function') window.isInFlow = () => !!window.mainStoryPlaying;
  if (typeof window.isInStoryFlow !== 'function') window.isInStoryFlow = () => !!window.mainStoryPlaying;
  if (typeof window.heroDisplayMaxHp !== 'function') window.heroDisplayMaxHp = () => (window.G && window.G.hero) ? (window.G.hero.maxHp || 100) : 100;
  if (typeof window.heroineMaxHp !== 'function') window.heroineMaxHp = () => (window.G && window.G.hero) ? (window.G.hero.maxHp || 100) : 100;
  if (typeof window.sleep !== 'function') window.sleep = (ms) => new Promise(r => setTimeout(r, ms));
  if (typeof window.backToMenu !== 'function') window.backToMenu = () => { if(window.G) window.G.mode='menu'; if(document.body) document.body.className=''; };
  if (typeof window.applySwap !== 'function') window.applySwap = () => {};
  if (typeof window.bringToFront !== 'function') window.bringToFront = () => {};
  if (typeof window.castSkill !== 'function') window.castSkill = () => {};
  if (typeof window.flee !== 'function') window.flee = () => {};
  if (typeof window.skillSlots !== 'undefined') { /* 保留原 */ } else { window.skillSlots = []; }
  if (typeof window.SHOP_ITEMS === 'undefined') window.SHOP_ITEMS = [];
  if (typeof window.MAX_SAVES === 'undefined') window.MAX_SAVES = 8;
  if (typeof window.FOOD === 'undefined') window.FOOD = {};
  if (typeof window.ENEMIES === 'undefined') window.ENEMIES = {};
  if (typeof window.PROTAGONIST === 'undefined') window.PROTAGONIST = null;
  if (typeof window.ALLIES === 'undefined') window.ALLIES = {};

  // 关键：storyAdvanceDayToOne —— main_story 的 seg_000_opening.afterPlayed 会调这个
  // 必须返回一个会推进 day 到 1 的版本
  window.storyAdvanceDayToOne = function() {
    // 确保依赖都加载了
    setTimeout(() => {
      if (typeof G === 'undefined') return;
      if (typeof MAP === 'undefined') return;
      if (typeof switchMode !== 'function') return;
      if (typeof UI === 'undefined' || typeof UI.refreshAll !== 'function') return;
      if (G.day >= 1 && G.map) return;  // 已经推进过就不重复
      G.day = 1;
      G.map = MAP.generateMap();
      const spawn = MAP.pickHeroSpawn(G.map, null);
      G.px = spawn.x; G.py = spawn.y;
      G.mode = 'explore';
      switchMode('explore');
      UI.refreshAll();
      console.log('[storyAdvanceDayToOne] 推进到探索模式');
    }, 100);
  };
})();
</script>

</head>
<body>
<div id="app">
  <div id="hud"></div>
  <div id="iconbar"></div>
  <div id="main">
    <div id="leftLog">
      <div class="panel-title">行动记录</div>
      <div id="logBody"></div>
    </div>
    <div id="mapWrap">
      <div id="mapViewport"><div id="mapGrid"></div></div>
    </div>
    <div id="rightPanel">
      <div class="panel-title" id="rightTitle">信息</div>
      <div id="promptZone"></div>
      <button id="goBtn">前往</button>
    </div>
  </div>
  <div id="bottom" class="mode-story">
    <div id="storyBox">
      <div id="storyHead">
        <div id="storySpeaker"></div>
        <div id="storyControls">
          <button id="autoBtn" class="sctrl" title="自动模式">自动</button>
          <button id="skipBtn" class="sctrl" title="跳过本段剧情">跳过</button>
        </div>
      </div>
      <div id="storyBody"></div>
    </div>
    <div id="combatZone">
      <!-- 左栏：四行严格排版（高度硬锁死） -->
      <div id="cbLeft">
        <div id="cbRow1" class="cb-row">
          <div id="cbCharCards"></div>
          <div id="cbSkillGroup"></div>
        </div>
        <div id="cbRow2" class="cb-row">
          <div id="cbAttrs"></div>
        </div>
        <!-- 用户要求：天赋标签为第三行、状态芯片为第四行（之前相反） -->
        <div id="cbRow3" class="cb-row">
          <div id="cbTalentTags"></div>
        </div>
        <div id="cbRow4" class="cb-row">
          <div id="cbStatusChips"></div>
        </div>
      </div>
      <!-- 右栏：技能描述面板（独立区域，不参与四行排版） -->
      <div id="cbRight">
        <div id="cbSkillDesc">点击左侧技能图标查看详情</div>
      </div>
    </div>
  </div>
</div>
<div id="menuOverlay" class="overlay show">
  <div class="modal small">
    <h2>在成为勇者之前</h2>
    <div id="menuBtns"></div>
  </div>
</div>
<div id="modalOverlay" class="overlay">
  <div class="modal" id="modal">
    <button class="modal-x" id="modalX" onclick="onModalX()" aria-label="关闭">✕</button>
    <h2 id="modalTitle"></h2>
    <div id="modalBody"></div>
  </div>
</div>
<div id="gameoverOverlay" class="overlay">
  <div class="modal small">
    <h2>健康值归零 · 流浪终结</h2>
    <p id="goMsg"></p>
    <button class="mbtn" onclick="loadAfterGameOver()">读取存档</button>
    <button class="mbtn" onclick="backToMenu()">返回主界面</button>
  </div>
</div>
<div id="tooltip"></div>
<div id="popover"></div>
<div id="actTitleOverlay" class="act-title-overlay"></div>

<script src="js/data.js"></script>
<script src="js/save.js"></script>
<script src="js/map.js"></script>
<script src="js/rules.js"></script>
<script src="js/explore.js"></script>
<script src="js/combat.js"></script>
<script src="js/ui.js"></script>
<script src="js/craft.js"></script>
<script src="js/vehicle.js"></script>
<script src="js/event.js"></script>
<script src="main_story/index.js" type="module"></script>
<script src="js/main.js"></script>
</body>
</html>
