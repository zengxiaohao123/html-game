<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>在成为勇者之前</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script>
/* ============================================================
   剧情打字引擎（story engine）
   提供: storyPush / storyRunNext / storySetSpeaker / storyStartFragment
         storyMarkChoice / finishCurrentFragment / storyAutoMode
         forceEndStoryFlow / showActTitle / prompt
         lockEventUI / unlockEventUI
   ============================================================ */
(function() {
  'use strict';

  // ======== 内部状态 ========
  let _queue = [];           // 当前待播段落数组
  let _cursor = 0;           // 当前正在播第几个
  let _done = null;          // 全部播完后的回调
  let _typing = false;       // 是否正在打字
  let _typeTimer = null;     // 打字计时器
  let _skipBlocked = false;  // skipBlockedWhenChoice: 选项未出现前不能跳过
  let _hasChoice = false;    // 本段带选项
  let _choiceShown = false;  // 选项是否已显示
  let _unreadContent = '';   // 攒的所有未显示 HTML（用于一次性显示）

  // ======== DOM 快捷 ========
  const qs = (sel) => document.querySelector(sel);
  const storyBox = () => qs('#storyBox');
  const storyBody = () => qs('#storyBody');
  const storySpeaker = () => qs('#storySpeaker');
  const speakerEl = () => storySpeaker();

  // ======== 工具 ========
  function _clearTimer() {
    if (_typeTimer) { clearInterval(_typeTimer); _typeTimer = null; }
  }
  function _metaCommand(html) {
    // 处理【屏幕抖动】【闪白】【黑屏】【回忆开始/结束】【act:xxx】
    const cmdMap = {
      '屏幕抖动': () => _shake(),
      '抖动': () => _shake(),
      '屏幕闪白': () => _flash(),
      '闪白': () => _flash(),
      '屏幕黑屏': () => _black(),
      '黑屏': () => _black(),
      '回忆开始': () => _flashback(true),
      '进入回忆': () => _flashback(true),
      '回忆结束': () => _flashback(false),
      '退出回忆': () => _flashback(false),
      '变回正常': () => _flashback(false),
    };
    // 基础命令
    for (const [kw, fn] of Object.entries(cmdMap)) {
      if (html.includes('【' + kw + '】')) { fn(); return html.replace('【' + kw + '】', ''); }
    }
    // act:xxx 幕标题
    const actMatch = html.match(/【act[:：](.+?)】/);
    if (actMatch) { showActTitle(actMatch[1].trim()); return html.replace(actMatch[0], ''); }
    return html;
  }
  function _shake() {
    const app = qs('#app'); if (!app) return;
    app.classList.add('fx-shake');
    setTimeout(() => app.classList.remove('fx-shake'), 600);
  }
  function _flash() {
    const ov = document.createElement('div');
    ov.className = 'screen-effect fx-flash';
    document.body.appendChild(ov);
    setTimeout(() => ov.remove(), 400);
  }
  function _black() {
    const ov = document.createElement('div');
    ov.className = 'screen-effect fx-black';
    document.body.appendChild(ov);
    setTimeout(() => ov.remove(), 2700);
  }
  function _flashback(on) {
    const bottom = qs('#bottom'); if (!bottom) return;
    if (on) bottom.classList.add('storyFlashback');
    else bottom.classList.remove('storyFlashback');
  }

  // ======== 核心 API ========

  // 设置说话人名字
  window.storySetSpeaker = function(name) {
    const el = speakerEl(); if (!el) return;
    el.textContent = name || '';
    if (name) el.style.display = '';
    else el.style.display = 'none';
  };

  // 显示幕标题
  window.showActTitle = function(title) {
    const ov = qs('#actTitleOverlay'); if (!ov) return;
    ov.innerHTML = `<div class="act-title-text">${title}</div>`;
    ov.classList.add('show');
    setTimeout(() => ov.classList.remove('show'), 5500);
  };

  // prompt：设 #promptZone（右侧面板）
  window.prompt = function(html) {
    const pz = qs('#promptZone'); if (!pz) return;
    pz.innerHTML = html || '';
  };

  // finishCurrentFragment：清空 storyBox
  window.finishCurrentFragment = function() {
    const sb = storyBody(); if (!sb) return;
    sb.innerHTML = '';
    _queue = []; _cursor = 0; _typing = false; _hasChoice = false; _choiceShown = false;
    _clearTimer();
  };

  // forceEndStoryFlow：强制结束当前剧情播放
  window.forceEndStoryFlow = function() {
    _clearTimer();
    _queue = []; _cursor = 0; _typing = false;
    if (typeof window.mainStoryPlaying !== 'undefined') window.mainStoryPlaying = false;
    finishCurrentFragment();
    if (typeof window.renderIconbar === 'function') renderIconbar();
  };

  // markChoice：标记本段带选项
  window.storyMarkChoice = function() {
    _hasChoice = true;
    _skipBlocked = true;
  };

  // === 推一段 HTML（带打字机） ===
  window.storyPush = function(html, cb) {
    if (!html) { if (cb) cb(); return; }
    const sb = storyBody(); if (!sb) { if (cb) cb(); return; }
    // 处理元指令
    let clean = _metaCommand(String(html));
    if (!clean.trim()) { if (cb) cb(); return; }

    if (window.storyAutoMode) {
      // 自动模式：直接显示
      sb.innerHTML += `<p class="story-para">${clean}</p>`;
      sb.scrollTop = sb.scrollHeight;
      if (cb) setTimeout(cb, 400);
      return;
    }

    // 手动模式：打字机
    _typing = true;
    // 先加一个空段落
    const para = document.createElement('p');
    para.className = 'story-para';
    sb.appendChild(para);

    let idx = 0;
    const chars = clean.split('');
    _typeTimer = setInterval(() => {
      if (idx >= chars.length) {
        _clearTimer();
        _typing = false;
        sb.scrollTop = sb.scrollHeight;
        if (cb) cb();
        return;
      }
      para.innerHTML += chars[idx++];
      if (idx % 4 === 0) sb.scrollTop = sb.scrollHeight;
    }, 18);
  };

  // === storyRunNext：点一下继续 ===
  window.storyRunNext = function() {
    // 如果正在打字 → 直接跳到结尾
    if (_typing) {
      _clearTimer();
      _typing = false;
      return;
    }
    // 如果还没到末尾 → 播下一段
    if (_cursor < _queue.length) {
      _playNext();
      return;
    }
    // 已经播完
  };

  // === storyStartFragment：入口 ===
  window.storyStartFragment = function(segments, done, opts) {
    opts = opts || {};
    if (!Array.isArray(segments)) return;

    // 清空旧状态
    finishCurrentFragment();

    _queue = segments;
    _cursor = 0;
    _done = done;
    _skipBlocked = !!opts.skipBlockedWhenChoice;
    _hasChoice = false; _choiceShown = false;

    // 绑定点击事件（只绑一次）
    if (!window.__storyClickBound) {
      const sb = storyBox();
      if (sb) {
        sb.addEventListener('click', (e) => {
          // 如果点到了 option 按钮（promptZone 里的 .ev-opt），不触发继续
          if (e.target.closest('.ev-opt') || e.target.closest('#promptZone')) return;
          // 自动模式下点击不跳过
          if (window.storyAutoMode) return;
          storyRunNext();
        });
        window.__storyClickBound = true;
      }
    }

    // 开始播
    if (_queue.length > 0) _playNext();
    else { if (_done) _done(); }
  };

  function _playNext() {
    if (_cursor >= _queue.length) {
      // 全部播完
      if (_done) _done();
      return;
    }
    const seg = _queue[_cursor];
    // seg 可以是 string 或 {speaker, html}
    let html = '';
    let speaker = null;
    if (typeof seg === 'string') {
      html = seg;
    } else if (seg && typeof seg === 'object') {
      html = seg.html || '';
      speaker = seg.speaker || null;
    }

    if (speaker) storySetSpeaker(speaker);

    // 元指令处理
    html = _metaCommand(html);

    _cursor++;

    // 自动模式：直接 storyPush（内部会自动完整显示）
    // 手动模式：storyPush 带打字机，结束后等点击
    storyPush(html, () => {
      if (window.storyAutoMode) {
        setTimeout(() => _playNext(), 600);
      }
      // 手动模式下，等用户点击 storyBox 才会触发 storyRunNext → _playNext
    });
  }

  // ======== UI 辅助 ========
  window.lockEventUI = function() {
    const bottom = qs('#bottom'); if (bottom) bottom.classList.add('mode-event-lock');
    const go = qs('#goBtn'); if (go) go.style.display = 'none';
    if (typeof window.renderIconbar === 'function') renderIconbar();
  };
  window.unlockEventUI = function() {
    const bottom = qs('#bottom'); if (bottom) bottom.classList.remove('mode-event-lock');
    if (typeof window.renderIconbar === 'function') renderIconbar();
  };

  // renderIconbar 空实现（main_story 依赖）
  if (typeof window.renderIconbar !== 'function') {
    window.renderIconbar = function() {};
  }

  // 自动模式 flag
  window.storyAutoMode = false;

  // 切换自动模式按钮
  window.addEventListener('DOMContentLoaded', () => {
    const autoBtn = qs('#autoBtn');
    if (autoBtn) {
      autoBtn.addEventListener('click', () => {
        window.storyAutoMode = !window.storyAutoMode;
        autoBtn.classList.toggle('on', window.storyAutoMode);
      });
    }
    const skipBtn = qs('#skipBtn');
    if (skipBtn) {
      skipBtn.addEventListener('click', () => {
        // 跳到当前段结尾 → 再点一次跳过全部
        if (_typing) { _clearTimer(); _typing = false; }
        else { forceEndStoryFlow(); }
      });
    }
  });

})();
</script>

</head></head>
<body>
<div id="app">
  <div id="hud"></div>
  <div id="iconbar"></div>
  <div id="main">
    <div id="leftLog">
      <div class="panel-title">行动记录</div>
      <div id="logBody"></div>
    </div>
    <div id="mapWrap">
      <div id="mapViewport"><div id="mapGrid"></div></div>
    </div>
    <div id="rightPanel">
      <div class="panel-title" id="rightTitle">信息</div>
      <div id="promptZone"></div>
      <button id="goBtn">前往</button>
    </div>
  </div>
  <div id="bottom" class="mode-story">
    <div id="storyBox">
      <div id="storyHead">
        <div id="storySpeaker"></div>
        <div id="storyControls">
          <button id="autoBtn" class="sctrl" title="自动模式">自动</button>
          <button id="skipBtn" class="sctrl" title="跳过本段剧情">跳过</button>
        </div>
      </div>
      <div id="storyBody"></div>
    </div>
    <div id="combatZone">
      <!-- 左栏：四行严格排版（高度硬锁死） -->
      <div id="cbLeft">
        <div id="cbRow1" class="cb-row">
          <div id="cbCharCards"></div>
          <div id="cbSkillGroup"></div>
        </div>
        <div id="cbRow2" class="cb-row">
          <div id="cbAttrs"></div>
        </div>
        <!-- 用户要求：天赋标签为第三行、状态芯片为第四行（之前相反） -->
        <div id="cbRow3" class="cb-row">
          <div id="cbTalentTags"></div>
        </div>
        <div id="cbRow4" class="cb-row">
          <div id="cbStatusChips"></div>
        </div>
      </div>
      <!-- 右栏：技能描述面板（独立区域，不参与四行排版） -->
      <div id="cbRight">
        <div id="cbSkillDesc">点击左侧技能图标查看详情</div>
      </div>
    </div>
  </div>
</div>
<div id="menuOverlay" class="overlay show">
  <div class="modal small">
    <h2>在成为勇者之前</h2>
    <div id="menuBtns"></div>
  </div>
</div>
<div id="modalOverlay" class="overlay">
  <div class="modal" id="modal">
    <button class="modal-x" id="modalX" onclick="onModalX()" aria-label="关闭">✕</button>
    <h2 id="modalTitle"></h2>
    <div id="modalBody"></div>
  </div>
</div>
<div id="gameoverOverlay" class="overlay">
  <div class="modal small">
    <h2>健康值归零 · 流浪终结</h2>
    <p id="goMsg"></p>
    <button class="mbtn" onclick="loadAfterGameOver()">读取存档</button>
    <button class="mbtn" onclick="backToMenu()">返回主界面</button>
  </div>
</div>
<div id="tooltip"></div>
<div id="popover"></div>
<div id="actTitleOverlay" class="act-title-overlay"></div>

<script src="js/data.js"></script>
<script src="js/save.js"></script>
<script src="js/map.js"></script>
<script src="js/rules.js"></script>
<script src="js/explore.js"></script>
<script src="js/combat.js"></script>
<script src="js/ui.js"></script>
<script src="js/craft.js"></script>
<script src="js/vehicle.js"></script>
<script src="js/event.js"></script>
<script src="main_story/index.js" type="module"></script>
<script src="js/main.js"></script>
</body>
</html>
