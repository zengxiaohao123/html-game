<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>异世界流浪日记 · 核心循环</title>
<style>
:root{
  --bg:#14161c; --panel:#1c1f27; --panel2:#222533; --line:#33384a;
  --txt:#e8e6df; --txt-dim:#9aa0ac; --gold:#d9b64a;
  --fire:#ff5454; --water:#4a9bff; --grass:#5fd96b; --thunder:#c05bff;
  --ice:#4fd8d8; --wind:#8fd0ff; --rock:#b09a73;
  --good:#6ee07a; --bad:#ff6b6b;
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}
body{
  font-family:"Microsoft YaHei","PingFang SC",sans-serif;
  background:var(--bg); color:var(--txt); overflow:hidden;
  user-select:none;
}
#app{height:100vh;display:flex;flex-direction:column;}
#hud{
  display:flex; align-items:center; gap:14px; flex-wrap:wrap;
  padding:6px 10px; background:var(--panel); border-bottom:1px solid var(--line);
  font-size:13px; min-height:30px;
}
#hud .stat{white-space:nowrap;}
#hud .stat b{font-weight:600; color:#fff;}
.hpfill{color:var(--good);} .hpfill.low{color:var(--bad);}
#iconbar{
  display:flex; justify-content:flex-start; gap:6px; padding:4px 10px; flex-wrap:wrap;
  background:var(--panel); border-bottom:1px solid var(--line);
}
.icobtn{
  padding:4px 12px; background:var(--panel2); border:1px solid var(--line);
  cursor:pointer; font-size:13px; color:var(--txt); border-radius:3px;
}
.icobtn:hover{background:#2c3040;}
.icobtn.sleep{background:#3a2f12; color:var(--gold); font-weight:600;}
.icobtn.hidden{display:none;}
#main{flex:1; display:grid; grid-template-columns:250px 1fr 230px; gap:6px; padding:6px; min-height:0;}
#mapWrap{position:relative; background:var(--panel); border:1px solid var(--line); border-radius:4px; min-height:0;}
#mapViewport{position:absolute; inset:0; overflow:auto;}
#mapGrid{display:grid; gap:3px; padding:8px;}
.cell{
  width:44px; height:44px; background:var(--panel2); border:1px solid var(--line);
  border-radius:8px; cursor:pointer; position:relative; display:flex;align-items:center;justify-content:center;
  font-size:20px;
}
.cell.obstacle{background:#28261f; cursor:default;}
.cell.obstacle::after{content:"⛰"; color:#8a6d3b; font-size:22px;}
.cell.prey{outline:2px solid var(--gold); outline-offset:-2px;}
.cell.player{background:#31403a;}
.cell.enemyPick{outline:2px dashed var(--bad);}
.facing-up::after{content:"▲"; color:#fff; position:absolute; top:2px; left:50%; transform:translateX(-50%); font-size:10px;}
.facing-down::after{content:"▼"; color:#fff; position:absolute; bottom:2px; left:50%; transform:translateX(-50%); font-size:10px;}
.facing-left::after{content:"◀"; color:#fff; position:absolute; left:2px; top:50%; transform:translateY(-50%); font-size:10px;}
.facing-right::after{content:"▶"; color:#fff; position:absolute; right:2px; top:50%; transform:translateY(-50%); font-size:10px;}
.hpbar{position:absolute; left:3px; right:3px; bottom:2px; height:4px; background:#0006; border-radius:2px;}
.hpbar i{display:block; height:100%; background:var(--bad); border-radius:2px;}
.aura-tag{
  position:absolute; top:2px; left:2px; font-size:9px; color:#fff;
  background:#000a; padding:0 3px; border-radius:3px;
}
#leftLog{
  background:var(--panel); border:1px solid var(--line); border-radius:4px;
  display:flex; flex-direction:column; min-height:0;
}
.panel-title{padding:6px 8px; font-size:12px; color:var(--txt-dim); border-bottom:1px solid var(--line); flex:none;}
#logBody{flex:1; overflow-y:auto; padding:6px 8px; font-size:12px; line-height:1.6; min-height:0;}
#logBody .logline{border-bottom:1px dashed #00000044; padding:2px 0;}
#goBtn{
  margin:8px; padding:7px; background:var(--gold); color:#241d05; font-weight:700;
  border:none; border-radius:4px; cursor:pointer; display:none; font-size:13px; flex:none;
}
#goBtn.disabled{background:#555;cursor:not-allowed;}
#rightPanel{
  background:var(--panel); border:1px solid var(--line); border-radius:4px;
  display:flex; flex-direction:column; min-height:0;
}
#promptZone{flex:1; overflow-y:auto; padding:8px; font-size:13px; line-height:1.6; min-height:0;}
#promptZone .opt{margin:4px 0; padding:8px; background:var(--panel2); border:1px solid var(--line); cursor:pointer; border-radius:4px;}
#promptZone .opt:hover{background:#2c3040;}
#bottom{
  height:210px; background:var(--panel); border:1px solid var(--line); border-radius:4px;
  margin:0 6px 6px; padding:6px; position:relative; min-height:0;
}
#storyBox, #combatZone{display:none; height:100%; flex-direction:column; min-height:0;}
#bottom.mode-story #storyBox{display:flex;}
#bottom.mode-combat #combatZone{display:flex;}
#storyBody{flex:1; overflow-y:auto; padding:6px 8px; font-size:13px; line-height:1.7; min-height:0;}
#storyBody .speaker{color:var(--gold); font-weight:700;}
#combatZone h4, #storyBox h4{flex:none;}
#allyBar{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:6px;}
.allyTab{padding:5px 10px; background:var(--panel2); border:1px solid var(--line); cursor:pointer; font-size:12px; border-radius:3px;}
.allyTab.active{outline:2px solid var(--gold);}
#skillList{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:4px;}
.skillTag{padding:5px 10px; background:var(--panel2); border:1px solid var(--line); cursor:pointer; border-radius:3px; font-size:13px;}
.skillTag.attack{border-color:var(--fire);}
.skillTag.skill{color:var(--gold);}
.skillTag.active{outline:2px solid var(--gold); background:#2c3040;}
#skillDetail{font-size:12px; color:var(--txt-dim); min-height:2em; margin-bottom:4px;}
#talentBox{margin-top:auto;}
.overlay{
  position:fixed; inset:0; background:#000000c0; display:none; align-items:center; justify-content:center; z-index:50;
}
.overlay.show{display:flex;}
.modal{
  background:var(--panel); border:1px solid var(--line); border-radius:6px;
  width:min(92vw, 1000px); max-height:92vh; overflow:auto; padding:16px;
  display:flex; flex-direction:column;
}
.modal h2{font-size:17px; margin-bottom:10px; color:var(--gold); flex:none;}
#modalBody{flex:1; overflow-y:auto; min-height:0;}
.modal.wide{width:min(96vw, 1200px);}
.modal.small{width:min(420px,92vw); height:auto;}
.mbtn{
  display:block; width:100%; margin:6px 0; padding:11px; background:var(--panel2);
  border:1px solid var(--line); color:var(--txt); cursor:pointer; border-radius:4px; font-size:14px; text-align:left;
}
.mbtn:hover{background:#2c3040;}
.mbtn.small{width:auto; display:inline-block; padding:6px 14px; font-size:13px;}
.resRow{font-size:14px; line-height:2;}
.term{color:var(--gold); text-decoration:underline; text-underline-offset:2px; cursor:help;}
#tooltip{
  position:fixed; display:none; max-width:260px; background:#000d; color:#eee;
  border:1px solid var(--line); padding:6px 8px; font-size:12px; border-radius:4px; z-index:100;
  line-height:1.5;
}
.statGrid{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:8px; font-size:13px;}
.e-fire{color:var(--fire)!important;} .e-water{color:var(--water)!important;} .e-grass{color:var(--grass)!important;}
.e-thunder{color:var(--thunder)!important;} .e-ice{color:var(--ice)!important;} .e-wind{color:var(--wind)!important;} .e-rock{color:var(--rock)!important;}
.kbd{background:#000a; border:1px solid var(--line); border-radius:3px; padding:0 5px; font-size:11px;}
.btn-row{display:flex; gap:8px; flex-wrap:wrap;}
</style>
</head>
<body>
<div id="app">
  <div id="hud"></div>
  <div id="iconbar"></div>
  <div id="main">
    <div id="leftLog">
      <div class="panel-title">行动记录</div>
      <div id="logBody"></div>
      <button id="goBtn">前往</button>
    </div>
    <div id="mapWrap">
      <div id="mapViewport"><div id="mapGrid"></div></div>
    </div>
    <div id="rightPanel">
      <div class="panel-title" id="rightTitle">事件 / 选择</div>
      <div id="promptZone"></div>
    </div>
  </div>
  <div id="bottom" class="mode-story">
    <div id="storyBox">
      <div class="panel-title">剧情</div>
      <div id="storyBody"></div>
    </div>
    <div id="combatZone">
      <div class="panel-title">战斗 · 技能</div>
      <div id="allyBar"></div>
      <div id="skillList"></div>
      <div id="skillDetail"></div>
      <div id="talentBox"></div>
    </div>
  </div>
</div>
<div id="menuOverlay" class="overlay show">
  <div class="modal small">
    <h2>异世界流浪日记</h2>
    <div id="menuBtns"></div>
  </div>
</div>
<div id="modalOverlay" class="overlay">
  <div class="modal">
    <h2 id="modalTitle"></h2>
    <div id="modalBody"></div>
    <div class="btn-row" style="margin-top:8px">
      <button class="mbtn small" onclick="closeModal()">关闭</button>
    </div>
  </div>
</div>
<div id="gameoverOverlay" class="overlay">
  <div class="modal small">
    <h2>健康值归零 · 流浪终结</h2>
    <p id="goMsg"></p>
    <button class="mbtn" onclick="loadAfterGameOver()">读取存档</button>
    <button class="mbtn" onclick="backToMenu()">返回主界面</button>
  </div>
</div>
<div id="tooltip"></div>
<script>
"use strict";
const MAX_SAVES = 8;
const ELEM = {fire:{c:'e-fire',zh:'火'},water:{c:'e-water',zh:'水'},grass:{c:'e-grass',zh:'草'},
  thunder:{c:'e-thunder',zh:'雷'},ice:{c:'e-ice',zh:'冰'},wind:{c:'e-wind',zh:'风'},rock:{c:'e-rock',zh:'岩'}};
const AURA_ELEMS = ['fire','water','grass','thunder','ice'];
/* 资源中文名（展示用） */
const RES_ZH = {wood:'木材', fruit:'果子', flax:'亚麻', rawMeat:'生肉', coin:'金币', emptyBottle:'空瓶子'};
const TERMS = {
  alert:'主角天赋【战术布置】产生。我方单位攻击时优先攻击该目标；场上至多存在1个；主角用单体攻击新敌人时覆盖旧目标。',
  charge:'敌人进行强力攻击前的准备状态。蓄力期间不移动、不改变朝向。受到我方任意攻击即被打断。',
  bind:'无法移动，但可以攻击。',
  burn:'每回合开始时流失2%生命值（可致死，没有伤害来源）。持续3回合。',
  aggro:'攻击力+15%；受到的雷元素伤害与草元素伤害+25%。持续2回合。',
  superconduct:'雷、冰、物理抗性均降低30%。持续3回合。抗性最终结算强制限定在0%~90%之间。',
  frozen:'无法行动（包括移动、攻击、蓄力等一切主动行为，不包括被动效果）。持续1回合。',
  cage:'无法行动。',
  zone:'技能形成的区域效果。持续时间内对范围内单位施加特定效果。',
  extraTurn:'许泠朦【秋水澄心】天赋触发。仅泠朦能释放技能，无移动。各类增益减益不计时。冷却不减少。',
  steal:'对方的数值减少，自身的数值对应增加。',
  dodge:'在敌人即将攻击前从攻击范围内撤出。',
};
function termHTML(key, zh){
  return `<span class="term" data-term="${key}" title="${TERMS[key]||zh}">【${zh}】</span>`;
}
const PROTAGONIST = {
  key:'pro', name:'主角', element:null, color:null,
  base:{atk:10, maxHp:100, def:0, escapeSpeed:100, hp:100},
  passives:[
    {name:'战术布置', desc:'攻击时设置【重点目标】，我方优先攻击该目标。'},
    {name:'暴击', desc:'攻击力+10，暴击率+3%。'},
    {name:'嗜血', desc:'攻击力+20，攻击型技能3%概率回复自身=本次伤害的50%。'},
    {name:'起势', desc:'攻击力+30，使用攻击型技能后获得4%伤害加成。'},
    {name:'格挡', desc:'最大生命+50，受攻击3%概率本伤害归零。'},
    {name:'坚守', desc:'回合开始获得30护盾，受攻击6%概率回复12%生命。'},
  ],
  skills:[
    {id:'slash', name:'斩击', kind:'attack', type:'physical', range:1,
     effect:atk=>atk*1.00, target:'front', desc:'对前方一格的敌人造成相当于攻击力100%的物理伤害。'},
    {id:'blade', name:'万刃斩', kind:'attack', type:'physical', range:1,
     effect:atk=>atk*0.85, target:'adj', desc:'对周围四格的所有敌人造成相当于攻击力85%的物理伤害。'},
    {id:'despair', name:'拼命', kind:'attack', type:'physical', range:1,
     effect:atk=>atk*1.40, target:'front', selfDrain:0.20, desc:'对前方一格的敌人造成140%物理伤害，自身流失20%生命（可致死）。'},
    {id:'balance', name:'均衡', kind:'attack', type:'physical', range:1,
     effect:atk=>atk*0.70, target:'front', selfHeal:0.08, dr:0.40, desc:'对前方一格70%物理伤害，回复自身8%生命，本回合受伤害-40%。'},
    {id:'guerrilla', name:'游击', kind:'attack', type:'physical', range:2,
     effect:atk=>atk*0.70, target:'nearest', desc:'对两格距离内最近的一名敌人造成70%物理伤害。'},
  ],
  selectedSkillIds:['slash','blade','guerrilla']
};
const ENEMIES = {
  slime:{name:'哥布林', icon:'👺', hp:40, atk:8, dmgReduc:0, speed:20,
    skillMult:1.2, failureHealthPenalty:5, color:'#c05bff'},
  bat:{name:'毒蛾', icon:'🦋', hp:30, atk:6, dmgReduc:0, speed:30,
    skillMult:1.1, failureHealthPenalty:4, color:'#5fd96b', aura:'grass'},
  wolf:{name:'岩狼', icon:'🐺', hp:55, atk:10, dmgReduc:0.1, speed:25,
    skillMult:1.3, failureHealthPenalty:6, color:'#b09a73'},
};
function randKey(obj){const ks=Object.keys(obj); return ks[Math.floor(Math.random()*ks.length)];}
let G=null;
let combatState=null;
let gameMode='story';
let previewCell=null;
function newGame(){
  return {
    day:1, region:'wild',
    hero:{atk:10,maxHp:100,hp:100,def:0,escapeSpeed:100,health:30,actionPoint:5,apCap:5,facing:'up'},
    inventory:{wood:0,fruit:0,flax:0,rawMeat:0,coin:0,emptyBottle:0},
    records:{slain:{}, wins:0, losses:0},
    team:[PROTAGONIST.key],
    map:null, px:0, py:0, st:null,
    lootLog:[]
  };
}
function saveGame(slot){
  if(!G) return;
  const saves=loadSaves();
  const snap=JSON.parse(JSON.stringify(G));
  snap._ts=Date.now();
  saves[slot]=snap;
  localStorage.setItem('yysw_saves', JSON.stringify(saves));
}
function loadSaves(){try{return JSON.parse(localStorage.getItem('yysw_saves'))||{};}catch(e){return {};}}
function loadGame(slot){
  const saves=loadSaves();
  if(!saves[slot]) return false;
  G=JSON.parse(JSON.stringify(saves[slot]));
  return true;
}
function mapSizeForDay(day){
  const ref=[[1,4],[20,6],[50,8],[100,9],[150,12]];
  let n=4;
  for(const [d,s] of ref){ if(day>=d) n=s; }
  const jitter=Math.round((Math.random()-0.5)*2);
  return Math.max(4, n+jitter);
}
function generateMap(day){
  const n=mapSizeForDay(day);
  const cells=[];
  for(let i=0;i<n*n;i++) cells.push({terrain:'ground', content:'empty', idx:i});
  const obstacles=Math.floor(n*n*0.12);
  for(let k=0;k<obstacles;k++){
    const i=Math.floor(Math.random()*n*n);
    if(cells[i].idx===0) continue;
    cells[i].terrain='obstacle';
  }
  for(const c of cells){
    if(c.terrain==='obstacle') continue;
    c.content=rollContent(day);
  }
  ensureConnectivity(cells,n);
  const start=cells[0];
  start.content='empty';
  return {n, cells, px:0, py:0};
}
function rollContent(day){
  const r=Math.random();
  if(r<0.20) return {type:'enemy', key:randKey(ENEMIES), id:0};
  if(r<0.32) return {type:'loot', done:false};
  if(r<0.42) return {type:'event', done:false};
  return {type:'empty'};
}
function ensureConnectivity(cells,n){
  const idx=(x,y)=>y*n+x;
  const inb=(x,y)=>x>=0&&y>=0&&x<n&&y<n;
  const ground=[];
  for(let y=0;y<n;y++)for(let x=0;x<n;x++)if(cells[idx(x,y)].terrain==='ground')ground.push([x,y]);
  const visited=new Map(); const stack=[ground[0]];
  if(ground[0]) visited.set(ground[0][0]+','+ground[0][1],1);
  const fwd=[[1,0],[-1,0],[0,1],[0,-1]];
  while(stack.length){
    const [cx,cy]=stack.pop();
    for(const [dx,dy] of fwd){
      const nx=cx+dx, ny=cy+dy;
      if(!inb(nx,ny)) continue;
      const cell=cells[idx(nx,ny)];
      if(cell.terrain!=='ground') continue;
      if(visited.has(nx+','+ny)) continue;
      visited.set(nx+','+ny,1);
      stack.push([nx,ny]);
    }
  }
  markBridge(cells,n,visited);
}
function markBridge(cells,n,visited){
  const idx=(x,y)=>y*n+x;
  const inb=(x,y)=>x>=0&&y>=0&&x<n&&y<n;
  const fwd=[[1,0],[-1,0],[0,1],[0,-1]];
  for(let y=0;y<n;y++)for(let x=0;x<n;x++){
    const c=cells[idx(x,y)];
    if(c.terrain!=='ground') continue;
    if(visited.has(x+','+y)) continue;
    for(const [dx,dy] of fwd){
      const nx=x+dx,ny=y+dy;
      if(!inb(nx,ny)) continue;
      if(cells[idx(nx,ny)].terrain==='obstacle'){
        cells[idx(nx,ny)].terrain='ground';
      }else if(visited.has(nx+','+ny)){
        visited.set(x+','+y,1);
        expandVisited(cells,n,x,y,visited);
        break;
      }
    }
  }
}
function expandVisited(cells,n,x,y,visited){
  const idx=(x0,y0)=>y0*n+x0; const inb=(a,b)=>a>=0&&b>=0&&a<n&&b<n;
  const stack=[[x,y]]; visited.set(x+','+y,1);
  const fwd=[[1,0],[-1,0],[0,1],[0,-1]];
  while(stack.length){
    const [cx,cy]=stack.pop();
    for(const [dx,dy] of fwd){
      const nx=cx+dx,ny=cy+dy;
      if(!inb(nx,ny))continue;
      if(cells[idx(nx,ny)].terrain!=='ground')continue;
      if(visited.has(nx+','+ny))continue;
      visited.set(nx+','+ny,1); stack.push([nx,ny]);
    }
  }
}
const $=id=>document.querySelector(id);
function el(html){const d=document.createElement('div'); d.innerHTML=html; return d.firstElementChild;}
function switchMode(m){
  gameMode=m;
  $('#bottom').classList.toggle('mode-story', m==='story');
  $('#bottom').classList.toggle('mode-combat', m==='combat');
  $('#rightTitle').textContent = m==='combat' ? '插曲' : '事件 / 选择';
  if(m==='story') $('#goBtn').style.display='none';
}
function refreshHUD(){
  if(!G) return;
  const h=G.hero;
  const hpCls=h.hp< h.maxHp*0.3?'hpfill low':'hpfill';
  $('#hud').innerHTML=
    `<span class="stat">健康 <b>${h.health}</b></span>`+
    `<span class="stat">天数 <b>${G.day}</b></span>`+
    `<span class="stat">区域 <b>${G.region==='wild'?'野外':'城市'}</b></span>`+
    `<span class="stat">攻击 <b>${h.atk}</b></span>`+
    `<span class="stat">防御 <b>${h.def}</b></span>`+
    `<span class="stat">生命 <b class="${hpCls}">${h.hp}/${h.maxHp}</b></span>`+
    `<span class="stat">金币 <b>${G.inventory.coin}</b></span>`+
    `<span class="stat">行动力 <b>${h.actionPoint}/${h.apCap}</b></span>`;
}
function renderIconbar(){
  if(!G) return;
  const show=[[ '任务',openTasks],['编队',openFormation],['角色',openCharacters],
    ['背包',openInventory],['睡觉',sleep],['设置',openSettings],['商店',openShop]];
  $('#iconbar').innerHTML=show.map(([t,f],i)=>`<button class="icobtn${t==='睡觉'?' sleep':''}" data-i="${i}">${t}</button>`).join('');
  $('#iconbar').querySelectorAll('.icobtn').forEach(b=>b.onclick=()=>show[+b.dataset.i][1]());
  $('#iconbar').querySelectorAll('.icobtn')[6].classList.toggle('hidden', G.day<3);
}
function log(msg){ 
  const d=el(`<div class="logline">${msg}</div>`);
  $('#logBody').appendChild(d);
  $('#logBody').scrollTop=$('#logBody').scrollHeight;
}
function story(html){$('#storyBody').insertAdjacentHTML('beforeend',`<div>${html}</div>`); $('#storyBody').scrollTop=$('#storyBody').scrollHeight;}
function prompt(msg){$('#promptZone').innerHTML=msg;}
function e(txt){
  if(typeof txt!=='string') return txt;
  const map={fire:'火',water:'水',grass:'草',thunder:'雷',ice:'冰',wind:'风',rock:'岩'};
  for(const k in map){
    const re=new RegExp(map[k]+'(元素|附着|伤害|系)?','g');
    txt=txt.replace(re, (m)=>`<span class="${ELEM[k].c}">${m}</span>`);
  }
  return txt;
}
function renderMap(){
  const m=G.map; const grid=$('#mapGrid');
  grid.style.gridTemplateColumns=`repeat(${m.n},44px)`;
  grid.innerHTML='';
  for(let y=0;y<m.n;y++){
    for(let x=0;x<m.n;x++){
      const c=m.cells[y*m.n+x];
      const cell=el('<div class="cell"></div>');
      if(c.terrain==='obstacle'){cell.classList.add('obstacle');}
      if(c.content && c.content.type) renderCellContent(cell,c);
      if(G.px===x&&G.py===y){cell.classList.add('player'); cell.classList.add('facing-'+G.hero.facing);}
      cell.dataset.x=x; cell.dataset.y=y;
      cell.addEventListener('click',()=>onCellClick(x,y));
      grid.appendChild(cell);
    }
  }
}
function renderCellContent(cell,c){
  if(c.content.type==='enemy'){
    const eDef=ENEMIES[c.content.key];
    cell.textContent=eDef.icon;
    cell.style.color=eDef.color;
    cell.title=eDef.name;
    cell.innerHTML+=`<div class="hpbar"><i style="width:${Math.max(5,c.content.hp||eDef.hp)/eDef.hp*100}%"></i></div>`;
    if(c.content.aura) cell.innerHTML+=`<div class="aura-tag">${ELEM[c.content.aura].zh}</div>`;
  } else if(c.content.type==='loot' && !c.content.done){
    cell.textContent='📦'; cell.title='宝箱';
  } else if(c.content.type==='event' && !c.content.done){
    cell.textContent='❓'; cell.title='事件';
  }
}
function onCellClick(x,y){
  if(combatState){ combatCellClick(x,y); return; }
  const m=G.map;
  const c=m.cells[y*m.n+x];
  if(c.terrain==='obstacle'){ prompt('这是一片无法通行的山脉。'); return; }
  previewCell={x,y};
  let info=`位置 (${x+1},${y+1})<br>`;
  if(c.content && c.content.type==='enemy') info+=`前方遭遇 <b>${ENEMIES[c.content.key].name}</b><br>移动过去将进入战斗。`;
  else if(c.content && c.content.type==='loot') info+='此处有一个宝箱。';
  else if(c.content && c.content.type==='event') info+='此处有事件发生。';
  else info+='空地。';
  prompt(info);
  activateGo(x,y);
}
function activateGo(x,y){
  const go=$('#goBtn');
  go.style.display='block';
  go.disabled=false;
  go.classList.remove('disabled');
  go.onclick=()=>{ go.style.display='none'; moveExplore(x,y); };
}
function moveExplore(x,y){
  if(combatState) return;
  const m=G.map;
  const dx=x-G.px, dy=y-G.py;
  if(Math.abs(dx)+Math.abs(dy)!==1){ log('只能移动到相邻一格（上下左右）。'); return; }
  const target=m.cells[y*m.n+x];
  if(target.terrain==='obstacle'){ log('有山脉阻挡，无法通行。'); return; }
  if(G.hero.actionPoint<1){ log('行动力不足，请先「睡觉」进入下一天。'); return; }
  $('#goBtn').style.display='none';
  G.hero.actionPoint-=1;
  G.hero.facing = dirToFacing(dx,dy);
  G.px=x; G.py=y;
  const drops=dropResources();
  if(drops){ G.inventory[drops.kind]+=drops.amount; log(`获得 <b>${drops.amount}</b> 份 ${RES_ZH[drops.kind]}。`); }
  if(target.content && target.content.type==='enemy'){ log(`遭遇 <b>${ENEMIES[target.content.key].name}</b>！进入战斗。`); startCombat(target); }
  else if(target.content && target.content.type==='loot' && !target.content.done){ openLoot(target); }
  else if(target.content && target.content.type==='event' && !target.content.done){ runEvent(target); }
  else { log('这里空无一物。'); }
  if(!combatState){ refreshHUD(); renderMap(); }
}
function dirToFacing(dx,dy){
  if(dx>0)return 'right'; if(dx<0)return 'left'; if(dy>0)return 'down'; return 'up';
}
function dropResources(){
  const pool = G.region==='wild'? ['wood','fruit','flax','rawMeat'] : ['coin','emptyBottle'];
  const kind=pool[Math.floor(Math.random()*pool.length)];
  let n=0, p=0.5;
  while(n<3 && Math.random()<p){ n++; p=0.5; }
  if(n===0) return null;
  return {kind, amount:n*2};
}
function openLoot(target){
  target.content.done=true;
  const kinds = G.region==='wild'? ['wood','fruit','flax','rawMeat']:['coin','emptyBottle'];
  const k=kinds[Math.floor(Math.random()*kinds.length)];
  const amt=k==='coin'?1+Math.floor(Math.random()*3):1;
  G.inventory[k]+=amt;
  log(`开启宝箱，获得 <b>${amt}</b> 份 ${RES_ZH[k]}。`);
  refreshHUD(); renderMap();
}
function runEvent(target){
  target.content.done=true;
  const ev=Math.random();
  if(ev<0.4){
    const g=2+Math.floor(Math.random()*3);
    G.inventory.coin+=g; log(`你遇到商人的遗落行囊，获得 <b>${g}</b> 金币。`);
  } else if(ev<0.7){
    if(G.hero.hp<G.hero.maxHp){ G.hero.hp=Math.min(G.hero.maxHp, G.hero.hp+Math.floor(G.hero.maxHp*0.15)+10); log('你在一处温泉旁歇脚，回复了部分生命。'); }
    else log('你在温泉旁歇脚，精神为之一振。');
  } else {
    G.hero.health=Math.max(0,G.hero.health-1); log('一场虚惊让健康有所消耗。');
  }
  refreshHUD(); renderMap();
}
function startCombat(cell){
  combatState={
    hero:{x:G.px,y:G.py,facing:G.hero.facing,hp:G.hero.hp,maxHp:G.hero.maxHp,shield:0,auras:[]},
    enemies:[],
    playerMoved:false, heroUsedSkill:false, playerOver:false,
    selectedSkillId:'slash', selectedEnemy:null,
    entryCell:G.px+','+G.py,
    day:G.day
  };
  const epos=placeEnemyNear(G.px,G.py,G.map.n);
  combatState.enemies.push({
    x:epos.x, y:epos.y,
    def:ENEMIES[cell.content.key], key:cell.content.key, hp:cell.content.hp||ENEMIES[cell.content.key].hp,
    aura:ENEMIES[cell.content.key].aura||null, charge:0, shield:0
  });
  story('战斗开始！');
  log('进入战斗。你得击败所有敌人。');
  enterCombatMode();
}
function placeEnemyNear(px,py,n){
  const cand=[[px+1,py],[px-1,py],[px,py+1],[px,py-1]];
  for(const [x,y] of cand){
    if(x<0||y<0||x>=n||y>=n) continue;
    if(G.map.cells[y*n+x].terrain==='ground') return {x,y};
  }
  return {x:px,y:py};
}
function enterCombatMode(){
  switchMode('combat');
  updateCombatUI();
  refreshHUD();
  renderCombatMap();
}
function renderCombatMap(){
  if(!combatState) return;
  const m=G.map; const grid=$('#mapGrid');
  grid.style.gridTemplateColumns=`repeat(${m.n},44px)`;
  grid.innerHTML='';
  for(let y=0;y<m.n;y++)for(let x=0;x<m.n;x++){
    const c=m.cells[y*m.n+x];
    const cell=el('<div class="cell"></div>');
    if(c.terrain==='obstacle')cell.classList.add('obstacle');
    const cs=combatState;
    if(cs.hero.x===x&&cs.hero.y===y){cell.classList.add('player');cell.classList.add('facing-'+cs.hero.facing);}
    for(const en of cs.enemies){
      if(en.x===x&&en.y===y){
        cell.textContent=ENEMIES[en.key].icon; cell.style.color=ENEMIES[en.key].color;
        cell.title=ENEMIES[en.key].name;
        cell.innerHTML+=`<div class="hpbar"><i style="width:${Math.max(5,en.hp)/ENEMIES[en.key].hp*100}%"></i></div>`;
        if(en.aura)cell.innerHTML+=`<div class="aura-tag">${ELEM[en.aura].zh}</div>`;
      }
    }
    cell.dataset.x=x;cell.dataset.y=y;
    cell.addEventListener('click',()=>combatCellClick(x,y));
    grid.appendChild(cell);
  }
}
function combatCellClick(x,y){
  const cs=combatState;
  if(!cs) return;
  const enemy=cs.enemies.find(en=>en.x===x&&en.y===y);
  if(enemy){ cs.selectedEnemy=enemy; prompt(`已选定目标：${ENEMIES[enemy.key].name}`); updateCombatUI(); return; }
  const dx=x-cs.hero.x, dy=y-cs.hero.y;
  if(Math.abs(dx)+Math.abs(dy)!==1){ prompt('只能移动到相邻一格。'); return; }
  const c=G.map.cells[y*G.map.n+x];
  if(c.terrain==='obstacle'){ prompt('山脉阻挡。'); return; }
  if(cs.enemies.some(en=>en.x===x&&en.y===y)){ prompt('有敌人占据该格。'); return; }
  if(cs.playerMoved){ prompt('本回合已移动，请先结算敌人行动。'); return; }
  cs.hero.facing=dirToFacing(dx,dy);
  cs.hero.x=x; cs.hero.y=y;
  cs.playerMoved=true;
  autoCastHero();
  endPlayerPhase();
}
function castSelectedSkill(){
  if(!combatState) return;
  if(combatState.playerMoved){ prompt('本回合已移动，技能请于移动前使用。'); return; }
  if(combatState.heroUsedSkill||combatState.playerOver){ return; }
  const skill=PROTAGONIST.skills.find(s=>PROTAGONIST.selectedSkillIds.includes(s.id)&&s.id===combatState.selectedSkillId)||PROTAGONIST.skills.find(s=>s.id===combatState.selectedSkillId);
  if(!skill){ return; }
  resolveSkill(PROTAGONIST, skill, true);
  if(!combatState) return;
  combatState.heroUsedSkill=true;
  updateCombatUI();
}
function resolveSkill(actor, skill, manual){
  if(!combatState) return;
  const enemy=combatState.selectedEnemy || combatState.enemies[0];
  if(!enemy) return;
  let dmg=computeDamageActor(actor, skill, enemy);
  const txt=e(`${skill.name}对${ENEMIES[enemy.key].name}造成${Math.round(dmg)}点伤害。`);
  log(txt); story(`<b>${actor.name}</b>：${txt}`);
  applyEnemyDamage(enemy,dmg,skill);
  if(skill.selfDrain){ const lost=Math.min(G.hero.hp, Math.floor(G.hero.maxHp*skill.selfDrain)); G.hero.hp-=lost; log(`自身流失${lost}生命。`); }
  if(skill.selfHeal){ G.hero.hp=Math.min(G.hero.maxHp,G.hero.hp+Math.floor(G.hero.maxHp*skill.selfHeal)); }
  if(skill.type!=='physical' && AURA_ELEMS.includes(skill.type)){ setAura(enemy, skill.type); }
  checkCombatEnd();
}
function computeDamageActor(actor, skill, enemy){
  let base = actor.base ? actor.base.atk : (actor.atk||0);
  let dmg = base;
  dmg *= (1 - (ENEMIES[enemy.key].dmgReduc||0));
  dmg *= skill.effect ? skill.effect(1) : 1;
  return dmg;
}
function autoCastHero(){
  if(!combatState||combatState.heroUsedSkill) return;
  const skill=PROTAGONIST.skills.find(s=>s.id===combatState.selectedSkillId);
  if(!skill) return;
  resolveSkill(PROTAGONIST, skill, false);
  if(!combatState) return;
  combatState.heroUsedSkill=true;
}
function applyEnemyDamage(enemy,dmg,skill){
  enemy.hp-=dmg;
  if(enemy.hp>0 && skill.type!=='physical' && skill.type!=='wind' && skill.type!=='rock'){
    checkReaction(enemy, skill.type);
  }
  if(enemy.hp<=0){
    log(`${ENEMIES[enemy.key].name} 被击败！`);
    combatState.enemies=combatState.enemies.filter(e=>e!==enemy);
  }
}
function setAura(enemy,elem){ if(AURA_ELEMS.includes(elem)) enemy.aura=elem; }
function checkReaction(enemy, elementHit){
  if(!enemy.aura || enemy.aura===elementHit) return;
  const a=enemy.aura, h=elementHit;
  if(a==='fire'&&h==='water'){ enemy.hp-=Math.max(1,Math.round(enemy.hp*0.15)); log(`<span class="e-water">蒸发</span>！${ENEMIES[enemy.key].name}受额外伤害。`); }
  else if(a==='water'&&h==='grass'){ spawnSlime(); log(`${termHTML('zone','绽放')}生成一只草史莱姆援军。`); }
  else if(a==='fire'&&h==='grass'){ enemy.burn=3; log(`<span class="e-grass">燃烧</span>！${ENEMIES[enemy.key].name}将持续灼烧。`); }
  enemy.aura=null;
}
function spawnSlime(){
  const e=combatState.enemies[0];
  if(e){ e.hp-=4; log('草史莱姆助战，施加草系冲击。'); }
}
function checkCombatEnd(){
  if(!combatState) return;
  if(combatState.enemies.length===0){
    G.records.wins=(G.records.wins||0)+1;
    log('战斗胜利！');
    story('战斗胜利，你收起了武器。');
    endCombat(true);
    return;
  }
  if(combatState.hero.hp<=0){
    endCombatByDefeat();
  }
}
function enemyTurn(){
  const cs=combatState; if(!cs) return;
  const enemy=cs.enemies[0];
  if(!enemy) return;
  if(enemy.burn){ enemy.burn--; const burn=Math.max(1,Math.round(enemy.hp*0.02)); enemy.hp-=burn; log(`${ENEMIES[enemy.key].name}受燃烧流失${burn}生命。`); }
  const dx=cs.hero.x-enemy.x, dy=cs.hero.y-enemy.y;
  enemy.facing=dirToFacing(dx,dy);
  const dist=Math.abs(dx)+Math.abs(dy);
  if(dist===1){
    const eDef=ENEMIES[enemy.key];
    let dmg=eDef.atk*eDef.skillMult;
    const shield=cs.hero.shield;
    if(shield>0){ const absorb=Math.min(shield,dmg); cs.hero.shield-=absorb; dmg-=absorb; }
    dmg=Math.max(1,Math.round(dmg));
    cs.hero.hp-=dmg;
    log(`${ENEMIES[enemy.key].name} 攻击你，造成 ${dmg} 点伤害。`);
    if(eDef.aura){ cs.hero.aura=eDef.aura; }
  } else {
    let nx=enemy.x, ny=enemy.y;
    if(Math.abs(dx)>Math.abs(dy)) nx += dx>0?1:-1; else ny += dy>0?1:-1;
    if(G.map.cells[ny*G.map.n+nx].terrain!=='obstacle' && !cs.enemies.some(e2=>e2!==enemy&&e2.x===nx&&e2.y===ny)){
      if(!(nx===cs.hero.x&&ny===cs.hero.y)){ enemy.x=nx; enemy.y=ny; log(`${ENEMIES[enemy.key].name} 逼近。`); }
    }
  }
  cs.hero.shield=0;
  checkCombatEnd();
}
function endPlayerPhase(){
  const cs=combatState; if(!cs) return;
  if(cs.enemies.length===0){ return; }
  enemyTurn();
  if(!combatState) return;
  cs.hero.shield=0; cs.playerMoved=false; cs.heroUsedSkill=false; cs.playerOver=false;
  renderCombatMap(); updateCombatUI(); refreshHUD();
}
function updateCombatUI(){
  if(!combatState){ $('#combatZone').classList.remove('active'); switchMode('story'); return; }
  const cs=combatState;
  prompt(
    `主角 生命 ${Math.round(cs.hero.hp)}/${Math.round(cs.hero.maxHp)}${cs.hero.shield>0?` 护盾${Math.round(cs.hero.shield)}`:''}<br>`+
    cs.enemies.map(en=>`<span style="color:${ENEMIES[en.key].color}">${ENEMIES[en.key].name}</span> 生命 ${Math.round(en.hp)}${en.aura?`（附着·${ELEM[en.aura].zh}）`:''}${cs.selectedEnemy===en?' <b>←目标</b>':''}<br>`).join('')+
    `<br><b>操作</b>：点选下方技能，再按 <b>Q</b> 释放；或先 <b>移动</b>（点击相邻格 / WASD），移动后会 自动攻击最近的敌人。`
  );
  $('#allyBar').innerHTML=G.team.map(t=>`<div class="allyTab ${t==='pro'?'active':''}" data-t="${t}">${t==='pro'?PROTAGONIST.name:''}</div>`).join('');
  $('#allyBar').querySelectorAll('.allyTab').forEach(b=>b.onclick=()=>selectAlly(b.dataset.t));
  const skills=PROTAGONIST.skills.filter(s=>PROTAGONIST.selectedSkillIds.includes(s.id));
  $('#skillList').innerHTML=skills.map(s=>`<div class="skillTag ${s.kind==='attack'?'attack':'skill'} ${cs.selectedSkillId===s.id?'active':''}" data-s="${s.id}" title="${s.desc}">${s.name}</div>`).join('');
  $('#skillList').querySelectorAll('.skillTag').forEach(b=>b.onclick=()=>{ cs.selectedSkillId=b.dataset.s; updateCombatUI(); });
  const cur=PROTAGONIST.skills.find(s=>s.id===cs.selectedSkillId);
  $('#skillDetail').innerHTML=(cur?`<b>${cur.name}</b>：${e(cur.desc)}`:'');
}
function selectAlly(key){ log('当前阶段：仅主角可操作。'); }
/* 键盘操作：探索用 WASD 移动，战斗用 WASD 移动 / Q 释放技能 */
document.addEventListener('keydown',ev=>{
  const k=ev.key.toLowerCase();
  if(combatState){
    if(k==='q'){ castSelectedSkill(); }
    if(k==='w'){ combatMove(0,-1); }
    if(k==='s'){ combatMove(0,1); }
    if(k==='a'){ combatMove(-1,0); }
    if(k==='d'){ combatMove(1,0); }
    return;
  }
  if(!G||!G.map) return;
  if(ev.repeat) return;
  let dx=0,dy=0;
  if(k==='w'){dy=-1;} else if(k==='s'){dy=1;} else if(k==='a'){dx=-1;} else if(k==='d'){dx=1;} else {return;}
  const nx=G.px+dx, ny=G.py+dy;
  if(nx<0||ny<0||nx>=G.map.n||ny>=G.map.n) return;
  moveExplore(nx,ny);
});
function combatMove(dx,dy){
  const cs=combatState; if(!cs)return;
  if(cs.playerMoved) return;
  const nx=cs.hero.x+dx, ny=cs.hero.y+dy;
  if(nx<0||ny<0||nx>=G.map.n||ny>=G.map.n)return;
  const c=G.map.cells[ny*G.map.n+nx];
  if(c.terrain==='obstacle')return;
  if(cs.enemies.some(en=>en.x===nx&&en.y===ny))return;
  cs.hero.facing=dirToFacing(dx,dy);
  cs.hero.x=nx;cs.hero.y=ny; cs.playerMoved=true;
  autoCastHero();
  if(!combatState) return;
  renderCombatMap(); updateCombatUI(); refreshHUD();
  endPlayerPhase();
}
function endCombat(victory){
  const cs=combatState;
  const [ex,ey]=cs.entryCell.split(',').map(Number);
  G.px=ex; G.py=ey; G.hero.hp=Math.max(1,Math.round(cs.hero.hp||1));
  G.hero.facing='up';
  combatState=null;
  const e=G.map.cells[ey*G.map.n+ex];
  if(e.content&&e.content.type==='enemy'&&victory){ e.content={type:'empty'}; }
  switchMode('story');
  renderMap(); refreshHUD();
}
function endCombatByDefeat(){
  const cs=combatState;
  const eDef=ENEMIES[cs.enemies[0].key];
  G.hero.health=Math.max(0,G.hero.health-(eDef.failureHealthPenalty||5));
  log(`战斗失败，健康值 -${eDef.failureHealthPenalty||5}。`);
  story('你败下阵来，狼狈退回安全处。');
  G.hero.hp=1;
  combatState=null;
  const [ex,ey]=cs.entryCell.split(',').map(Number);
  G.px=ex; G.py=ey;
  switchMode('story');
  renderMap(); refreshHUD();
  if(G.hero.health<=0){ showGameOver(); }
  else { alertDialog('战斗失败','你损失了部分健康。'); }
}
function showGameOver(){
  $('#goMsg').innerHTML='你的健康已归零，流浪在此终结。你仍可读取存档重新开始。';
  $('#gameoverOverlay').classList.add('show');
}
function loadAfterGameOver(){ $('#gameoverOverlay').classList.remove('show'); openReadSaveMenu(); }
function backToMenu(){ $('#gameoverOverlay').classList.remove('show'); showMenu(); }
function sleep(){
  if(!G) return;
  if(G.hero.actionPoint>0 && !confirm('行动力尚未耗尽，仍确定直接「睡觉」进入下一天吗？')) return;
  G.hero.actionPoint=G.hero.apCap;
  G.day+=1;
  G.map=null;
  const nm=generateMap(G.day);
  G.map=nm; G.px=0; G.py=0; G.hero.facing='up';
  G.hero.hp=Math.max(1, Math.min(G.hero.maxHp, Math.round(G.hero.hp+G.hero.maxHp*0.2)));
  saveGame(2);
  log(`你睡了一觉，进入第 ${G.day} 天。`);
  story(`夜色褪去，新的一天开始了。今天是第 ${G.day} 天。`);
  refreshHUD(); renderMap(); renderIconbar();
}
function openSettings(){ openModal('设置', `
  <button class="mbtn" onclick="saveMenuOpen()">存档</button>
  <button class="mbtn" onclick="openReadSave()">读档</button>
  <button class="mbtn" onclick="closeModal();backToMenu()">返回主界面（不存档）</button>`, 'small'); }
function saveMenuOpen(){ openModal('选择存档位', buildSaveSlotHTML('save'), 'small'); }
function openReadSave(){ openReadSaveMenu(); }
function openModal(title,html,size){
  $('#modalTitle').textContent=title;
  const modal=$('#modalOverlay').querySelector('.modal');
  modal.className='modal'+(size==='small'?' small':(size==='wide'?' wide':''));
  $('#modalBody').innerHTML=html;
  $('#modalOverlay').classList.add('show');
}
function closeModal(){ $('#modalOverlay').classList.remove('show'); }
function alertDialog(title,msg){
  openModal(title, `<p>${msg}</p>`, 'small');
}
function openSaveMenu(){ openModal('选择存档位', buildSaveSlotHTML('save'), 'small'); }
function buildSaveSlotHTML(action){
  const saves=loadSaves();
  return savesSlotsHTML(action,saves);
}
function savesSlotsHTML(action,saves){
  let h='';
  for(let i=0;i<MAX_SAVES;i++){
    const s=saves[i];
    h+=`<button class="mbtn" onclick="${action==='save'?`doSave(${i})`:`doLoad(${i})`}">`+
       `存档位 ${i+1}${s?` — 第 ${s.day} 天 · 健康${s.hero.health} · ${new Date(s._ts).toLocaleString()}`:'（空）'}`+
      `</button>`;
  }
  return h;
}
window.doSave=function(i){ saveGame(i); log(`已保存到存档位 ${i+1}。`); closeModal(); };
window.doLoad=function(i){ if(loadGame(i)){ loadIntoWorld(); } else{ alert('该存档位为空。'); } };
function openReadSaveMenu(){ openModal('读取存档', buildSaveSlotHTML('load'), 'small'); }
function openInventory(){
  const inv=G.inventory;
  const rows=Object.entries(inv).map(([k,v])=>`<div class="resRow">${RES_ZH[k]||k}：<b>${v}</b></div>`).join('');
  openModal('背包', `<p>你随身携带的物品：</p>${rows}`);
}
function openCharacters(){
  const h=G.hero;
  openModal('角色 · 主角',
    `<div class="statGrid">
       <span>攻击 <b>${h.atk}</b></span><span>最大生命 <b>${h.maxHp}</b></span>
       <span>防御 <b>${h.def}</b></span><span>逃跑速度 <b>${h.escapeSpeed}</b></span>
       <span>健康 <b>${h.health}</b></span><span>行动力上限 <b>${h.apCap}</b></span>
     </div>
     <div><b>天赋</b>：</div>
     ${PROTAGONIST.passives.map(p=>`<div style="font-size:13px;color:var(--txt-dim);margin:3px 0">· ${p.name}：${p.desc}</div>`).join('')}
     <div style="margin-top:10px"><b>技能</b>（战斗中可带 3 个）：</div>
     ${PROTAGONIST.skills.map(s=>`<div style="font-size:13px;color:var(--txt-dim);margin:3px 0">· ${s.name}${PROTAGONIST.selectedSkillIds.includes(s.id)?' <span style="color:var(--gold)">[携带]</span>':''}：${e(s.desc)}</div>`).join('')}`);
}
function openFormation(){
  openModal('编队', `<p>当前队伍（主角一人）。后续可换入队友并调整站位。</p>
    <div style="font-size:14px;margin-top:8px">· 一号位：主角</div>
    <p style="color:var(--txt-dim);margin-top:8px">队友（许泠朦 / 夏阳 / 陆悠悠 / 叶唯安等）在后续版本加入。</p>`);
}
function openTasks(){
  openModal('任务', `<p>任务记录：</p>
    <p>· 存活下去（进行中）</p>
    <p>· 探索第 ${G.day} 天的新地图（进行中）</p>`);
}
function openShop(){
  openModal('商店', `<p>商店商品与定价仍在设计中（待定）。</p>`);
}
function showMenu(){
  if(G) saveGame(0);
  $('#menuOverlay').classList.add('show');
  $('#menuBtns').innerHTML=
    `<button class="mbtn" onclick="startNew()">新的游戏</button>`+
    `<button class="mbtn" onclick="openReadSave()">读取存档</button>`+
    `<button class="mbtn" onclick="openTutorial()">玩法简介</button>`;
}
function openTutorial(){
  openModal('玩法简介',
    `探索：<b>点击地图格子再点「前往」</b>，或用 <b>WASD</b> 键移动。<br>
    进入下一天：点上方 <b>睡觉</b> 按钮。<br>
    遇敌进入回合战斗：先点选下方 <b>技能</b>，再按 <b>Q</b> 释放；或直接移动，移动后会自动攻击最近的敌人。<br>
    数值与系统依据《玩法机制介绍-总篇》。`, 'small');
}
window.addEventListener('load',()=>{
  bindTooltip();
  switchMode('story');
  if(loadSaves()[1]) loadGame(1);
  showMenu();
});
function startNew(){
  $('#menuOverlay').classList.remove('show');
  G=newGame();
  G.map=generateMap(G.day);
  G.px=0;G.py=0;
  loadIntoWorld();
}
function loadIntoWorld(){
  $('#menuOverlay').classList.remove('show');
  if(!G.map) G.map=generateMap(G.day);
  if(G.px===undefined){G.px=0;G.py=0;}
  switchMode('story');
  refreshHUD(); renderIconbar(); renderMap();
  story('你又一次在异世界醒来。这一次，你决定无论如何都要活下去。');
}
function bindTooltip(){
  document.addEventListener('mouseover',ev=>{
    const t=ev.target.closest('.term'); if(!t)return;
    const tip=$('#tooltip'); tip.style.display='block';
    tip.textContent=t.title||TERMS[t.dataset.term]||'';
    positionTip(tip,ev);
  });
  document.addEventListener('mouseout',ev=>{ if(ev.target.closest('.term')) $('#tooltip').style.display='none'; });
  document.addEventListener('mousemove',ev=>{ positionTip($('#tooltip'),ev); });
}
function positionTip(tip,ev){
  const x=Math.min(ev.clientX+14, window.innerWidth-270);
  const y=ev.clientY+14;
  tip.style.left=x+'px'; tip.style.top=y+'px';
}
</script>
</body>
</html>
